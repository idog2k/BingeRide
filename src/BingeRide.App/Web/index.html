<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BingeRide">
<meta name="theme-color" content="#0B0D12">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>BingeRide</title>
<style>
  :root {
    --bg: #0B0D12; --panel: #141821; --panel2: #1B2030; --line: #262C3B;
    --text: #E8ECF4; --muted: #8A93A6; --accent: #3BA7FF; --good: #39D98A;
    --warn: #FFB84D; --bad: #FF4D6A; --rec: #E5484D; --mode: #9370DB;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 76px); user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; border: 0; border-radius: 14px; background: var(--panel2); padding: 12px 14px; cursor: pointer; }
  button:active { transform: scale(0.97); filter: brightness(1.25); }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .label { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }

  header { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--panel2); font-size: 13px; font-weight: 600; color: var(--muted); }
  .chip.on { color: var(--good); }
  .chip.warn { color: var(--warn); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  #rec { margin-left: auto; color: var(--rec); }
  #rec.paused { color: var(--warn); }

  .hero { display: flex; justify-content: space-between; align-items: flex-end; }
  #power { font-size: 72px; font-weight: 800; line-height: 1; }
  #power small { font-size: 18px; color: var(--muted); font-weight: 600; margin-left: 4px; }
  #target { font-size: 32px; font-weight: 700; color: var(--mode); text-align: right; }
  #modeLabel { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--mode); text-align: right; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .grid > div { background: var(--panel2); border-radius: 12px; padding: 8px 10px; }
  .grid b { display: block; font-size: 22px; }

  #cue { background: #1A2B45; border: 1px solid var(--accent); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; font-weight: 600; font-size: 18px; }
  .progress { height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; margin: 10px 0 8px; }
  .progress > div { height: 100%; width: 0; background: var(--mode); transition: width .4s; }
  #wStep { font-size: 20px; font-weight: 700; }
  #wLeft { font-size: 40px; font-weight: 800; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row.spread { justify-content: space-between; }
  .row > button { flex: 1; }

  .control { display: grid; grid-template-columns: 96px 1fr 96px; gap: 10px; align-items: center; }
  .control button { height: 96px; font-size: 44px; font-weight: 300; border-radius: 22px; }
  .control .value { text-align: center; }
  #ctlValue { font-size: 44px; font-weight: 800; display: block; color: var(--mode); }
  #grade { margin-top: 10px; }
  #grade button { height: 56px; font-size: 28px; }

  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--panel2); border-radius: 16px; padding: 5px; margin-bottom: 10px; }
  .modes button { background: transparent; font-weight: 700; padding: 12px 0; }
  .modes button.active { background: var(--accent); color: #0B0D12; }

  #food { font-size: 15px; }
  #foodIcons { font-size: 28px; letter-spacing: 2px; }

  #ridebar button { font-weight: 700; padding: 16px; }
  #startRide { background: var(--rec); color: #fff; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(3, 1fr);
    background: rgba(20,24,33,.96); border-top: 1px solid var(--line); padding: 6px 8px calc(env(safe-area-inset-bottom) + 6px); backdrop-filter: blur(10px); }
  nav button { background: transparent; color: var(--muted); font-weight: 700; padding: 10px 0; }
  nav button.active { color: var(--accent); }

  .item { display: flex; align-items: center; gap: 10px; }
  .item .grow { flex: 1; min-width: 0; }
  .item .title { font-weight: 700; }
  .item .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .item button { background: var(--accent); color: #0B0D12; font-weight: 700; }
  .error { color: var(--bad); }

  #offline { position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 6px); background: var(--warn); color: #0B0D12;
    font-weight: 700; padding: 10px 14px; border-radius: 12px; text-align: center; z-index: 10; }
  #awake { text-align: center; font-size: 13px; color: var(--muted); margin: 4px 0 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="offline" hidden>Reconnecting to BingeRide…</div>

<header>
  <span class="chip" id="chipTrainer"><span class="dot"></span><span>Trainer</span></span>
  <span class="chip" id="chipClick"><span class="dot"></span><span>Click</span></span>
  <span class="chip" id="chipHr">♥ <span id="hrChip">—</span></span>
  <span class="chip" id="rec" hidden><span class="dot"></span><span id="recText" class="num">0:00</span></span>
</header>
<div id="awake">Tap anywhere to keep the screen awake</div>

<section id="tabRide">
  <div class="card">
    <div class="hero">
      <div id="power" class="num">0<small>W</small></div>
      <div><div id="modeLabel">FREE</div><div id="target" class="num">—</div></div>
    </div>
    <div class="grid">
      <div><span class="label">Cadence</span><b class="num" id="cadence">0</b></div>
      <div><span class="label">Heart</span><b class="num" id="hr">—</b></div>
      <div><span class="label">Speed</span><b class="num" id="speed">0.0</b></div>
      <div><span class="label">Distance</span><b class="num" id="distance">0 m</b></div>
      <div><span class="label">Time</span><b class="num" id="time">0:00</b></div>
      <div><span class="label">Avg W</span><b class="num" id="avg">0</b></div>
    </div>
  </div>

  <div id="cue" hidden></div>

  <div class="card" id="workout" hidden>
    <div class="label" id="wBanner"></div>
    <div class="row spread" style="margin-top:6px">
      <div style="min-width:0"><div id="wStep"></div><div class="muted" id="wNext" style="font-size:14px;margin-top:2px"></div></div>
      <div style="text-align:right"><div id="wTarget" class="num" style="font-weight:700;color:var(--mode)"></div><div id="wLeft" class="num"></div></div>
    </div>
    <div class="progress"><div id="wProgress"></div></div>
    <div class="row">
      <button data-action="previousStep">⏮</button>
      <button data-action="togglePause" id="wPause">Pause</button>
      <button data-action="skipStep">⏭</button>
      <button data-action="endWorkout">End</button>
    </div>
  </div>

  <div class="card">
    <div class="control">
      <button data-action="down" aria-label="minus">−</button>
      <div class="value"><span class="label" id="ctlLabel">Gear</span><span id="ctlValue" class="num">12</span><span class="muted" id="ctlSub" style="font-size:13px"></span></div>
      <button data-action="up" aria-label="plus">+</button>
    </div>
    <div class="row" id="grade" hidden>
      <button data-action="gradeDown">−</button>
      <div style="flex:1;text-align:center"><span class="label">Grade</span><b class="num" id="gradeValue" style="display:block;font-size:26px">0.0%</b></div>
      <button data-action="gradeUp">+</button>
    </div>
  </div>

  <div class="modes" id="modes">
    <button data-mode="Erg">ERG</button>
    <button data-mode="Slope">Slope</button>
    <button data-mode="Free">Free</button>
  </div>

  <div class="card" id="trip">
    <span class="label">Travelled</span>
    <div class="row spread"><b id="tripKm" class="num"></b><span id="tripText" style="font-size:14px;text-align:right"></span></div>
    <div class="progress"><div id="lifeBar"></div></div>
    <div class="muted" style="font-size:13px"><span id="lifeText"></span> · <span id="lifeNext"></span></div>
  </div>

  <div class="card" id="food">
    <span class="label">Burned</span>
    <div class="row spread"><span id="foodIcons"></span><b id="kcal" class="num"></b></div>
    <div class="muted" id="nextFood" style="font-size:13px"></div>
  </div>

  <div class="row" id="ridebar">
    <button id="startRide" data-action="startRide">▶ Start ride</button>
    <button id="pauseRide" data-action="togglePause" hidden>❚❚ Pause</button>
    <button id="finishRide" data-action="finishRide" hidden>■ Finish</button>
  </div>
</section>

<section id="tabWorkouts" hidden><div id="workoutList"></div></section>
<section id="tabRides" hidden><div id="rideList"></div></section>

<nav>
  <button data-tab="Ride" class="active">Ride</button>
  <button data-tab="Workouts">Workouts</button>
  <button data-tab="Rides">Rides</button>
</nav>

<script src="/nosleep.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let state = null;

// Keep the screen on while riding (iOS needs a tap first).
const noSleep = typeof NoSleep === "function" ? new NoSleep() : null;
document.addEventListener("click", () => {
  if (noSleep && !noSleep.isEnabled) noSleep.enable().then(() => $("awake").hidden = true).catch(() => {});
}, { capture: true });

function chip(el, dev) {
  el.classList.toggle("on", dev.connected);
  el.title = dev.text;
}

function render(s) {
  state = s;
  document.documentElement.style.setProperty("--mode", s.modeColor);
  chip($("chipTrainer"), s.trainer);
  chip($("chipClick"), s.click);
  $("chipClick").classList.toggle("warn", s.click.text.includes("locked"));
  $("chipHr").classList.toggle("on", s.heartRateSensor.connected);
  $("hrChip").textContent = s.heartRate;

  const recording = s.rideState === "Recording", paused = s.rideState === "Paused";
  $("rec").hidden = !(recording || paused);
  $("rec").classList.toggle("paused", paused);
  $("recText").textContent = (paused ? "Paused " : "") + s.rideTimer;

  $("power").firstChild.nodeValue = s.power;
  $("modeLabel").textContent = s.modeLabel;
  $("target").textContent = s.target;
  $("cadence").textContent = s.cadence;
  $("hr").textContent = s.heartRate;
  $("speed").textContent = s.speed;
  $("distance").textContent = s.distance;
  $("time").textContent = s.rideTime;
  $("avg").textContent = s.avgPower;

  $("cue").hidden = !s.cue;
  $("cue").textContent = s.cue ?? "";

  const w = s.workout;
  $("workout").hidden = !w;
  $("modes").hidden = !!w;
  if (w) {
    $("wBanner").textContent = w.banner;
    $("wStep").textContent = w.step;
    $("wTarget").textContent = w.stepTarget;
    $("wLeft").textContent = w.stepLeft;
    $("wNext").textContent = w.next;
    $("wProgress").style.width = Math.round(w.progress * 100) + "%";
    $("wPause").textContent = w.paused ? "Resume" : "Pause";
  }
  for (const b of $("modes").querySelectorAll("button")) b.classList.toggle("active", b.dataset.mode === s.mode);

  $("ctlLabel").textContent = { gears: "Gear", watts: "ERG watts", intensity: "Intensity" }[s.control];
  $("ctlValue").textContent = s.controlValue;
  $("ctlSub").textContent = s.control === "gears" ? "ratio " + s.gearRatio : "";
  $("grade").hidden = s.mode !== "Slope";
  $("gradeValue").textContent = s.grade;

  $("trip").hidden = !s.showLandmarks;
  $("tripKm").textContent = s.distance;
  $("tripText").textContent = s.landmark;
  $("lifeText").textContent = s.lifetime;
  $("lifeNext").textContent = s.lifetimeNext;
  $("lifeBar").style.width = Math.round(s.lifetimeFraction * 100) + "%";

  $("food").hidden = !s.showFood;
  $("foodIcons").textContent = s.food;
  $("kcal").textContent = s.kcal;
  $("nextFood").textContent = s.nextFood;

  $("startRide").hidden = recording || paused;
  $("pauseRide").hidden = !(recording || paused);
  $("pauseRide").textContent = paused ? "▶ Resume" : "❚❚ Pause";
  $("finishRide").hidden = !(recording || paused);
}

async function send(command) {
  const res = await fetch("/api/command", {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json", "X-BingeRide": "1" },
    body: JSON.stringify(command),
  });
  if (res.status === 401) return location.reload();
  if (res.ok) render(await res.json());
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.action) send({ action: b.dataset.action });
  else if (b.dataset.mode) send({ action: "mode", mode: b.dataset.mode });
  else if (b.dataset.tab) showTab(b.dataset.tab);
  else if (b.dataset.workout) send({ action: "startWorkout", workout: b.dataset.workout }).then(() => showTab("Ride"));
});

async function showTab(name) {
  for (const t of ["Ride", "Workouts", "Rides"]) $("tab" + t).hidden = t !== name;
  for (const b of document.querySelectorAll("nav button")) b.classList.toggle("active", b.dataset.tab === name);
  window.scrollTo(0, 0);
  if (name === "Workouts") {
    const list = await (await fetch("/api/workouts")).json();
    $("workoutList").innerHTML = list.length ? list.map(w => `
      <div class="card item">
        <div class="grow"><div class="title">${esc(w.name)}</div>
          <div class="sub ${w.valid ? "" : "error"}">${esc(w.valid ? w.summary : w.error)}</div></div>
        ${w.valid ? `<button data-workout="${esc(w.id)}">Start</button>` : ""}
      </div>`).join("") : `<div class="card muted">No workouts yet. Ask Claude for one!</div>`;
  } else if (name === "Rides") {
    const list = await (await fetch("/api/rides")).json();
    $("rideList").innerHTML = list.length ? list.map(r => `
      <div class="card"><div class="title" style="font-weight:700">${esc(r.title)}</div>
        <div class="sub muted" style="font-size:13px">${esc(r.date)}</div>
        <div style="font-size:14px;margin-top:6px">${esc(r.stats)}</div>
        <div style="font-size:14px;margin-top:2px">${esc(r.landmark)}</div>
        <div style="font-size:14px;margin-top:2px">${esc(r.food)}</div></div>`).join("")
      : `<div class="card muted">No rides yet. Press Start ride, then Finish.</div>`;
  }
}

// Live feed. EventSource reconnects by itself; a 401 means this phone was forgotten.
function connect() {
  const events = new EventSource("/api/events");
  events.onmessage = e => { $("offline").hidden = true; render(JSON.parse(e.data)); };
  events.onerror = async () => {
    $("offline").hidden = false;
    try {
      const res = await fetch("/api/state");
      if (res.status === 401) { events.close(); location.reload(); }
    } catch { /* PC asleep or out of Wi-Fi range: keep retrying */ }
  };
}
connect();
</script>
</body>
</html>
