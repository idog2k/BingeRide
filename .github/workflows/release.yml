name: Release

# Publishes a GitHub release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test

  release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Read the version from the tag
        run: Add-Content $env:GITHUB_ENV "VERSION=$($env:GITHUB_REF_NAME.TrimStart('v'))"

      - name: Build BingeRide.exe
        run: >-
          dotnet publish src/BingeRide.Windows -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none "-p:Version=$env:VERSION" -o publish/win-x64

      - name: Build BingeRide-Setup.exe
        run: ./scripts/build-installer.ps1 -Version $env:VERSION

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          dist/BingeRide-Setup.exe publish/win-x64/BingeRide.exe
          --title "BingeRide $env:VERSION" --generate-notes --verify-tag
